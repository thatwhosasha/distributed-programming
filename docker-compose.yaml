services:
  rabbitmq-pa3:
    image: rabbitmq:3.13.7-management
    container_name: rabbitmq-pa3
    hostname: rabbitmq-pa3
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_pa3_data:/var/lib/rabbitmq

  redis-main:
    image: redis
    container_name: redis-main
    ports:
      - "6000:6379"

  redis-ru:
    image: redis
    container_name: redis-ru
    ports:
      - "6001:6379"

  redis-eu:
    image: redis
    container_name: redis-eu
    ports:
      - "6002:6379"

  redis-asia:
    image: redis
    container_name: redis-asia
    ports:
      - "6003:6379"

volumes:
  rabbitmq_pa3_data: